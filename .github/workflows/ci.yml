name: API checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: local-admin-fixture-password-12345
          POSTGRES_DB: archy_api_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DJANGO_SECRET_KEY: isolated-ci-secret-key-for-tests-only-at-least-fifty-characters
      TEST_DATABASE_URL: postgresql://postgres:local-admin-fixture-password-12345@127.0.0.1:5432/archy_api_test
      TEST_MIGRATION_URL: postgresql://archy_api_migrator:local-migration-fixture-password-12345@127.0.0.1:5432/archy_api_test
      TEST_RUNTIME_URL: postgresql://archy_api_runtime:local-runtime-fixture-password-12345@127.0.0.1:5432/archy_api_test
      DATABASE_URL: postgresql://archy_api_migrator:local-migration-fixture-password-12345@127.0.0.1:5432/archy_api_test
      DATABASE_ROLE: migration
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - name: Bootstrap isolated database
        run: |
          python - <<'PY'
          import os
          from config.environment import validate_test_url
          from scripts.bootstrap_db import bootstrap
          validate_test_url(os.environ['TEST_DATABASE_URL'])
          bootstrap(os.environ['TEST_DATABASE_URL'], 'local-migration-fixture-password-12345', 'local-runtime-fixture-password-12345')
          PY
      - run: python -m scripts.migrate_db
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run
