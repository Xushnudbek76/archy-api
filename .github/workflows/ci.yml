name: API checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: local-admin-fixture-password-12345
          POSTGRES_DB: archy_api_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PG_BIN: /usr/lib/postgresql/17/bin
      TEST_DATABASE_URL: postgresql://postgres:local-admin-fixture-password-12345@127.0.0.1:5432/archy_api_test
      TEST_MIGRATION_URL: postgresql://archy_api_migrator:local-migration-fixture-password-12345@127.0.0.1:5432/archy_api_test
      TEST_RUNTIME_URL: postgresql://archy_api_runtime:local-runtime-fixture-password-12345@127.0.0.1:5432/archy_api_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - name: PostgreSQL recovery tools
        run: |
          sudo apt-get install -y postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y postgresql-client-17
      - name: Bootstrap isolated database
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          from app.libs.config import validate_database_url
          from scripts.bootstrap_db import bootstrap
          validate_database_url(os.environ['TEST_DATABASE_URL'], 'bootstrap', test=True)
          bootstrap(os.environ['TEST_DATABASE_URL'], 'local-migration-fixture-password-12345', 'local-runtime-fixture-password-12345')
          path = Path('.env.migrations')
          path.write_text('DATABASE_URL=' + os.environ['TEST_MIGRATION_URL'] + '\n')
          path.chmod(0o600)
          PY
      - run: python -m scripts.migrate_db .env.migrations
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest
      - run: python -m pip check
