name: archy-api
services:
  api:
    build: .
    image: archy-api:local
    init: true
    restart: unless-stopped
    env_file: .env.production
    ports:
      - '127.0.0.1:3007:3007'
    volumes:
      - media:/var/lib/archy/media
      - './.local/certificates:/run/archy-certs:ro'
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    mem_limit: 1g
    pids_limit: 128
    stop_grace_period: 30s
  worker:
    image: archy-api:local
    init: true
    profiles: [ai]
    restart: unless-stopped
    env_file: .env.production
    command: ['python', '-m', 'scripts.run_worker']
    healthcheck:
      disable: true
    volumes:
      - media:/var/lib/archy/media
      - './.local/certificates:/run/archy-certs:ro'
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    mem_limit: 2g
    pids_limit: 128
    stop_grace_period: 45s
volumes:
  media:
