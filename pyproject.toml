[project]
name = "archy-api"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
description = "Archy learning workspace API"

[tool.pytest.ini_options]
testpaths = ["tests", "apps"]
addopts = "-q"

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"**/migrations/*.py" = ["E501"]
